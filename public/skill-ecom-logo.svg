<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <!-- Brand Mark Icon -->
  <g transform="translate(10, 10)">
    <!-- Base Shield / Hexagon -->
    <rect x="5" y="5" width="90" height="90" rx="22" fill="#0F172A" />
    <rect x="5" y="5" width="90" height="90" rx="22" stroke="#D97706" stroke-width="2.5" stroke-opacity="0.6" />
    
    <!-- Academic Cap & Commerce Node -->
    <!-- Cap Top -->
    <path d="M 50 26 L 80 40 L 50 54 L 20 40 Z" fill="#F59E0B" />
    <!-- Cap Base Arc -->
    <path d="M 32 46.5 L 32 63 C 32 72 68 72 68 63 L 68 46.5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Tassel -->
    <path d="M 75 42.5 L 75 60 C 75 62 72 65 72 65" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="72" cy="66" r="2.5" fill="#FDE68A" />

    <!-- Commerce Growth Bar Nodes -->
    <rect x="36" y="76" width="6" height="10" rx="2" fill="#D97706" />
    <rect x="47" y="70" width="6" height="16" rx="2" fill="#F59E0B" />
    <rect x="58" y="64" width="6" height="22" rx="2" fill="#FBBF24" />
  </g>

  <!-- Typography: SKILL ECOM -->
  <text x="122" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-1" fill="#0F172A">
    SKILL<tspan dx="8" fill="#D97706">ECOM</tspan>
  </text>

  <!-- Tagline / Subtitle -->
  <text x="124" y="86" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5" fill="#64748B">
    INSTITUTE OF E-COMMERCE &amp; MANAGEMENT
  </text>
  
  <!-- Subtle Foundation Badge Line -->
  <line x1="124" y1="96" x2="490" y2="96" stroke="#E2E8F0" stroke-width="1.5" />
  <text x="124" y="108" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1" fill="#94A3B8">
    POWERED BY IIECM FOUNDATION • AICTE &amp; APSCHE ALIGNED
  </text>
</svg>
